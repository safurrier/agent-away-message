[project]
name = "agent-away-message"
version = "0.1.0"
description = "Privacy-first activity status for coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alex Furrier" }]
dependencies = [
    "click>=8.1",
    "openai>=2.0",
    "platformdirs>=4.0",
    "pypresence>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.11",
    "ty>=0.0.19",
    "pytest-xdist>=3.6",
]

[project.scripts]
agent-away-message = "agent_away_message.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
ignore-vcs = true
include = ["agent_away_message/**", "README.md", "SPEC.md", "LICENSE", "docs/**", "integrations/**"]

[tool.hatch.build.targets.wheel]
packages = ["agent_away_message"]

[tool.hatch.build.targets.sdist]
only-include = ["agent_away_message", "README.md", "SPEC.md", "LICENSE", "docs", "integrations", "pyproject.toml"]
exclude = ["docs/AGENTS.md"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "S", "PTH", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["agent_away_message"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_away_message --cov-report=term-missing --junit-xml=test-results/junit.xml -q"
markers = ["integration: opt-in HTTP/RPC integration tests"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
